<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="color-scheme" content="dark">
<meta name="description" content="Registro y análisis de KPIs de Smash Ultimate">
<title>Smash KPI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
// tema elegido (Ajustes): se aplica antes de dibujar, con su ícono y su manifiesto (el ícono con que se instala la app)
try {
  var t = localStorage.getItem('smash-kpi-theme');
  if (t === 'limpio') t = 'planilla'; // Planilla reemplazó a Limpio
  if (t === 'smash' || t === 'planilla') {
    document.documentElement.dataset.theme = t;
    document.querySelector('link[rel="manifest"]').href = 'manifest-' + t + '.json';
    document.querySelector('link[rel="icon"]').href = 'icons/' + t + '-192.png';
    document.querySelector('link[rel="apple-touch-icon"]').href = 'icons/' + t + '-192.png';
    if (t === 'planilla') {
      document.querySelector('meta[name="theme-color"]').content = '#111214';
      document.querySelector('meta[name="color-scheme"]').content = 'light';
    }
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar"><img id="appLogo" class="app-logo" src="icons/icon-192.png" alt=""><h1 id="title">Cargar game</h1></header>
<script>try { var t2 = localStorage.getItem('smash-kpi-theme'); if (t2 === 'limpio') t2 = 'planilla'; if (t2 === 'smash' || t2 === 'planilla') document.getElementById('appLogo').src = 'icons/' + t2 + '-192.png'; } catch (e) {}</script>
<div id="updateBar" class="update-bar" role="status" hidden></div>
<main id="view"><p class="empty">Cargando…</p></main>

<nav class="tabbar">
  <button data-tab="cargar" class="active">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Cargar</span></button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Estadísticas</span></button>
  <button data-tab="historial">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Historial</span></button>
  <button data-tab="notas">
    <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg><span>Notas</span></button>
  <button data-tab="ajustes">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
</nav>

<div id="sheet" class="sheet hidden"></div>

</body>
</html>
